[project]
name = "cookup"
version = "0.1.0"
description = "Planificateur de menus et liste de courses (Django / Vercel / Supabase)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3,<4",
    "whitenoise>=6.12,<7",
    "dj-database-url>=3.1,<4",
    "django-allauth[mfa]>=65.0,<66",
    "argon2-cffi>=25.1",
    "protego>=0.4",
    "nh3>=0.3",
    "recipe-scrapers>=15.12,<16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.14",
    "ruff>=0.17",
    "pip-audit>=2.10",
    "pytest-cov>=6",
]

[tool.uv]
# Aucune version publiée depuis moins de deux semaines (SPEC section 14).
exclude-newer = "2026-10-17T00:00:00Z"
# Dépendances transitives de pip-audit (dev uniquement) : correctifs de sécurité
# relus et acceptés malgré l'âge < 2 semaines (voir docs/dependencies.md).
exclude-newer-package = { certifi = "2026-10-19T00:00:00Z", filelock = "2026-10-18T00:00:00Z" }

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "S", "SIM", "DJ"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"apps/planner/engine/*" = ["S311"]  # graine reproductible, pas de cryptographie
"apps/catalog/ingredient_catalog.py" = ["E501"]
"apps/catalog/starter_data.py" = ["E501"]
"apps/onboarding/steps.py" = ["E501"]  # textes de l'assistant
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]
