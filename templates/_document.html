{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Menu du jour{% endblock %} · Menu du jour</title>
  <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a16" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{% url 'core:manifest' %}">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/print.css' %}" media="print">
  {% block extra_head %}{% endblock %}
  <script src="{% static 'js/outbox.js' %}" defer></script>
  <script src="{% static 'js/offline.js' %}" defer></script>
  <script src="{% static 'js/ui.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  {% block body %}{% endblock %}
  {% include "components/icons.html" %}
  {% block extra_body %}{% endblock %}
</body>
</html>
