{% load ui %}
{% if page.has_other_pages %}
  <nav class="cluster pagination" aria-label="Pagination">
    {% if page.has_previous %}<a class="btn btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">{% icon "arrow-left" %}Précédent</a>{% endif %}
    <span class="muted">Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Suivant{% icon "arrow-right" %}</a>{% endif %}
  </nav>
{% endif %}
