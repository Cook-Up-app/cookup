<div class="rating" role="radiogroup" aria-label="Note de 1 à 5">
  {% for group, options, index in widget.optgroups reversed %}{% for option in options reversed %}<input type="radio" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}><label for="{{ option.attrs.id }}" title="{{ option.label }}"><span aria-hidden="true">★</span><span class="visually-hidden">{{ option.label }}</span></label>{% endfor %}{% endfor %}
</div>
