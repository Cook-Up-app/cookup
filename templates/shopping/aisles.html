{% extends "base.html" %}
{% load ui %}
{% block title %}Ordre des rayons{% endblock %}
{% block content %}
  <header class="page-header"><div><h1>Ordre des rayons</h1><p>Numérotez les rayons dans l'ordre de votre parcours habituel : la liste de courses les suivra.</p></div></header>
  <form method="post" class="card form-card stack">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Enregistrer l'ordre</button>
  </form>
{% endblock %}
